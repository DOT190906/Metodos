
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Pokédex</title>

  <!-- Bulma -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
  >

  <!-- Estilos propios -->
  <link rel="stylesheet" href="./style.css">

  <!-- JavaScript -->
  <script src="./script.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="columns is-variable is-5">

      <!-- PANEL IZQUIERDO: BUSCADOR Y LISTA -->
      <div class="column is-6">
        <div class="box left-panel">

          <div class="field">
            <label class="label" for="searchInput">Búsqueda</label>
            <div class="control">
              <input
                class="input"
                type="text"
                id="searchInput"
                placeholder="Buscar Pokémon..."
                autocomplete="off"
              >
            </div>
          </div>

          <!-- Aquí aparecerán los recuadros -->
          <div class="pokemon-container" id="pokemonGrid"></div>

        </div>
      </div>

      <!-- PANEL DERECHO: POKÉMON SELECCIONADO -->
      <div class="column is-6">
        <div class="box right-panel">

          <div class="selected-box has-text-centered">
            <figure class="image selected-image-container">
              <img
                id="selectedImage"
                src=""
                alt="Pokémon seleccionado"
                hidden
              >
            </figure>

            <h2 id="selectedName" class="title is-4 mt-3">
              Pokémon Seleccionado
            </h2>

            <span id="selectedType" class="tag is-info">
              Tipo
            </span>
          </div>

          <div class="box description-box">
            <h3 class="subtitle is-5 has-text-weight-bold">
              Descripción
            </h3>

            <p id="selectedDescription">
              Selecciona un Pokémon para ver su descripción.
            </p>
          </div>

          <button
            type="button"
            id="deleteBtn"
            class="button is-danger is-fullwidth"
          >
            Eliminar
          </button>

        </div>
      </div>

    </div>
  </div>

  <!-- VENTANA PARA AÑADIR POKÉMON -->
  <div class="modal" id="addPokemonModal">

    <div class="modal-background" id="modalBackground"></div>

    <div class="modal-card">

      <header class="modal-card-head">
        <p class="modal-card-title">Añadir nuevo Pokémon</p>

        <button
          type="button"
          class="delete"
          aria-label="Cerrar"
          id="closeModalBtn"
        ></button>
      </header>

      <section class="modal-card-body">

        <form id="addPokemonForm">

          <div class="field">
            <label class="label" for="inputName">Nombre</label>
            <div class="control">
              <input
                class="input"
                type="text"
                id="inputName"
                placeholder="Ej. Eevee"
                required
              >
            </div>
          </div>

          <div class="field">
            <label class="label" for="inputType">Tipo</label>
            <div class="control">
              <input
                class="input"
                type="text"
                id="inputType"
                placeholder="Ej. Normal"
                required
              >
            </div>
          </div>

          <div class="field">
            <label class="label" for="inputGeneralImage">
              Imagen (URL o ruta del archivo)
            </label>

            <div class="control">
              <input
                class="input"
                type="text"
                id="inputGeneralImage"
                placeholder="https://static.wikia.nocookie.net/espokemon/images/2/21/Imagen_Pt.png/revision/latest?cb=20170317021908"
              >
            </div>

            <p class="help">
              La imagen es opcional. Puedes añadirla después.
            </p>
          </div>

          <div class="field">
            <label class="label" for="inputDescription">
              Descripción
            </label>

            <div class="control">
              <textarea
                class="textarea"
                id="inputDescription"
                placeholder="Escribe la descripción del Pokémon..."
                required
              ></textarea>
            </div>
          </div>

          <button
            type="submit"
            class="button is-success is-fullwidth mt-4"
          >
            Guardar Pokémon
          </button>

        </form>

      </section>
    </div>
  </div>
</body>
</html>
